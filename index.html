  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      color: #f2f2f2;
      font-family: "Montserrat", sans-serif;
      line-height: 1.6;
      overflow-x:hidden;
    }

    /* HEADER TRANSPARENTE */
    .main-header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      z-index: 100;
      transition: background 0.4s ease, backdrop-filter 0.4s ease;
    }

    .main-header.scrolled {
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
    }

    .logo {
      font-family: "Parisienne", cursive;
      font-size: 1.5rem;
      letter-spacing: 0.3em;
    }

    .main-nav {
      display: flex;
      gap: 24px;
      font-size: 0.9rem;
    }

    .main-nav a,
    .main-nav a:visited {
      color: #f2f2f2;
      text-decoration: none;
      text-transform: lowercase;
      letter-spacing: 0.08em;
      position:relative;
    }

    /* Subrayado moderno */
    .main-nav a:hover:after {
      content:"";
      position:absolute;
      left:0;
      bottom:-4px;
      width:100%;
      height:1px;
      background:#fff;
      opacity:.8;
    }

    .header-icons {
      display: flex;
      gap: 16px;
      font-size: 0.9rem;
    }

    .header-icons .icon,
    .header-icons .icon:visited {
      color: #f2f2f2;
      text-decoration: none;
    }

    /* HERO pantalla completa */
    .hero {
      margin-top: 0;
      height:100vh;
      position: relative;
      overflow: hidden;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-text {
      position: absolute;
      top: 62%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 1.5rem;
      color: #fff;
      letter-spacing: 0.14em;
    }

    /* --- CATEGORÍAS --- */
    .categories {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      width: 100%;
      margin-top: 140px;
    }

    .category {
      position: relative;
      overflow: hidden;
    }

    .category img {
      width: 100%;
      aspect-ratio: 271 / 558;
      object-fit: cover;
      display: block;
      filter:grayscale(100%) brightness(70%);
      transition:filter .4s ease, transform .4s ease;
    }

    .category:hover img {
      filter:grayscale(0%) brightness(100%);
      transform:scale(1.02);
    }

    .category h3 {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 1.1rem;
      opacity: 0;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      letter-spacing: 0.05em;
      transition: opacity 0.4s ease;
    }

    .category:hover h3 {
      opacity: 1;
    }

    /* --- ANIMACIÓN scroll --- */
    .fade-up {
      opacity:0;
      transform: translateY(40px);
      transition: opacity .8s ease, transform .8s ease;
    }

    .fade-up.visible {
      opacity:1;
      transform: translateY(0);
    }

    /* --- ABOUT / WHY --- */
    .about,
    .why {
      max-width: 1100px;
      margin: 140px auto;
      padding: 0 40px;
      text-align: center;
    }

    .about p,
    .why p {
      font-size: 1.1rem;
      line-height:1.9;
      margin-bottom:26px;
    }

    /* --- CONTACT STRIP --- */
    .contact-strip {
      max-width: 1100px;
      margin: 120px auto 280px;
      padding: 0 40px;
      position: relative;
      text-align:center;
    }

    .contact-strip-title {
      position: absolute;
      top:55%;
      left:50%;
      transform: translate(-50%, -50%);
      font-family: "Caveat";
      font-size: 3rem;
      color:#fff;
      text-shadow:0 0 8px rgba(0,0,0,.9);
    }

    .contact-strip-image {
      max-width:100%;
      display:block;
      margin:0 auto 32px;
    }

    @media(max-width:900px){
      .categories {
        grid-template-columns:1fr;
        gap:40px;
        padding:0 20px;
      }
      .hero-text{
        font-size:1.2rem;
      }
      .contact-strip-title{
        font-size:2.2rem;
      }
    }
  </style>

  <script>
    /* Header transparente → sólido al hacer scroll */
    document.addEventListener("scroll", () => {
      const header = document.querySelector(".main-header");
      if(window.scrollY > 30){
        header.classList.add("scrolled");
      } else {
        header.classList.remove("scrolled");
      }
    });

    /* Fade-up sections */
    document.addEventListener("scroll", () => {
      document.querySelectorAll(".fade-up").forEach(el=>{
        const rect = el.getBoundingClientRect();
        if(rect.top < window.innerHeight - 60){
          el.classList.add("visible");
        }
      });
    });
  </script>

</head>
