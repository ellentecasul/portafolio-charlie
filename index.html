<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlie...</title>

  <!-- Fuente Parisienne -->
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: #f2f2f2;
      font-family: "Montserrat", sans-serif;
      line-height: 1.6;
    }

    /* HEADER */
    .main-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.9);
      z-index: 100;
    }

    .logo {
      font-family: "Parisienne", cursive;
      font-size: 1.5rem;
      letter-spacing: 0.3em;
    }

    .main-nav {
      display: flex;
      gap: 24px;
      font-size: 0.9rem;
    }

    .main-nav a {
      color: #f2f2f2;
      text-decoration: none;
      text-transform: lowercase;
      letter-spacing: 0.08em;
    }

    .main-nav a:hover {
      opacity: 0.7;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
    }

    .header-icons .icon {
      color: #f2f2f2;
      text-decoration: none;
    }

    /* HERO */
    .hero {
      margin-top: 70px;
      position: relative;
      overflow: hidden;
    }

    .hero-image {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    .hero-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 1.6rem;
      text-transform: lowercase;
      letter-spacing: 0.12em;
      color: #ffffff;
      background: none;
      padding: 0;
    } 

    /* CATEGORÍAS */
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      background-color: #000;
    }

    .category {
      flex: 1 1 20%;
      min-width: 160px;
      text-align: center;
      position: relative;
    }

    .category img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      display: block;
    }

    .category h3 {
      margin: 8px 0 16px;
      font-size: 0.9rem;
      text-transform: lowercase;
    }

    /* SECCIONES DE TEXTO */
    .about,
    .why {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
    }

    .about h2,
    .why h2 {
      font-family: "Playfair Display", serif;
      margin-bottom: 22px;
      font-size: 1.4rem;
    }

    .about p,
    .why p {
      margin-bottom: 14px;
      font-size: 0.95rem;
    }

    /* FOOTER (PRIMERA IMAGEN) */
    .footer {
      margin-top: 80px;
    }
