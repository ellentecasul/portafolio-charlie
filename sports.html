<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports | Charlie</title>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      color: #fff;
      font-family: "Montserrat", sans-serif;
      line-height: 1.9;
    }

    /* HEADER — transparente arriba y cristal al hacer scroll */
    header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      z-index: 100;
      transition: background 0.35s ease, backdrop-filter 0.35s ease;
    }
    header.scrolled {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* Logo NEGRO sobre la foto → BLANCO al hacer scroll */
    .logo {
      font-family: "Parisienne", cursive;
      font-size: 1.8rem;
      letter-spacing: 0.3em;
      color: #000;
      text-decoration: none;
      transition: color 0.35s ease;
    }
    header.scrolled .logo {
      color: #fff;
    }

    /* Home NEGRO sobre foto → BLANCO al hacer scroll */
    header nav a {
      text-decoration: none;
      margin-left: 22px;
      font-size: 0.9rem;
      transition: color 0.35s ease;
      color: #000;
    }
    header.scrolled nav a {
      color: #fff;
    }

    /* HERO */
    .hero {
      position: relative;
    }
    .hero img {
      width: 100%;
      height: 620px;
      object-fit: cover;
      display: block;
    }

    /* Texto principal NEGRO */
    .hero-text {
      position: absolute;
      top: 80%;
      left: 60px;
      transform: translateY(-50%);
    }
    .hero-text h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.8rem;
      margin-bottom: 2px;
      line-height: 1.1;
      color: #000;
      text-shadow: 0 2px 12px rgba(255,255,255,0.45);
    }
    .hero-text p {
      font-size: 1.1rem;
      opacity: 0.95;
      line-height: 1.1;
      margin-top: 0;
      color: #000;
      text-shadow: 0 2px 12px rgba(255,255,255,0.45);
    }

    /* CONTENIDO estilo Home */
    .content {
      max-width: 1300px;
      margin: 160px auto 90px;
      padding: 0 6vw;
      text-align: center;
    }
    .content p {
      max-width: 1200px;
      margin: 0 auto 26px;
      font-size: 1.32rem;
      line-height: 1.65;
    }
    .section-subtitle {
      font-family: "Playfair Display", serif;
      font-size: 2.25rem;
      font-weight: 500;
      margin-bottom: 26px;
      margin-top: 90px;
      letter-spacing: -0.01em;
      text-align: center;
    }

    /* CARRUSEL (idéntico al anterior) */
    .gallery-carousel {
      max-width: 1400px;
      margin: 0 auto 130px;
      padding: 0 30px;
    }
    .carousel-main {
      position: relative;
      background: radial-gradient(circle at top left, #222 0, #050505 45%, #000 100%);
      border-radius: 20px;
      padding: 26px 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .carousel-main img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.7);
      transition: transform 0.4s ease;
    }
    .carousel-main img.active {
      transform: scale(1.015);
    }
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 999px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 2.2rem;
      color: #fff;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.25s ease, transform 0.25s ease;
    }
    .carousel-arrow.left { left: 18px; }
    .carousel-arrow.right { right: 18px; }
    .carousel-arrow:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-50%) scale(1.04);
    }
    .carousel-thumbs {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .carousel-thumb {
      flex: 0 0 auto;
      width: 150px;
      aspect-ratio: 3/2;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      opacity: 0.55;
      border: 1px solid rgba(255,255,255,0.12);
      transition: opacity 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
    }
    .carousel-thumb.active {
      opacity: 1;
      border-color: rgba(255,255,255,0.9);
      transform: translateY(-3px);
    }

    .footer-line {
      width: 100%;
      max-width: 1100px;
      height: 1px;
      background: rgba(255,255,255,0.12);
      margin: 140px auto 80px;
    }

    .contact-strip {
      max-width: 1100px;
      margin: 0 auto 160px;
      padding: 0 40px;
      text-align: center;
    }
    .contact-label {
      font-family: "Playfair Display", serif;
      font-size: 1.4rem;
      margin-top: 28px;
      margin-bottom: 4px;
      text-transform: lowercase;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.03em;
    }
    .contact-strip-info p {
      margin: 8px 0;
      font-size: 1rem;
    }
    .contact-strip-info a {
      color: #fff;
      text-decoration: none;
    }
    .contact-strip-info a:hover {
      opacity: 0.8;
    }
  </style>
</head>
