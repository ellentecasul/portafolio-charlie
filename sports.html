<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports | Charlie</title>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background-color: #000;   /* evita fondo gris de fuera */
    }

    body {
      color: #fff;
      font-family: "Montserrat", sans-serif;
      line-height: 1.9;
    }

    /* HEADER — transparente arriba y cristal al hacer scroll */
    header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      z-index: 100;
      transition: background 0.35s ease, backdrop-filter 0.35s ease;
    }
    header.scrolled {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* LOGO (tipografía y tracking como tenías) */
    .logo {
      font-family: "Parisienne", cursive;
      font-size: 1.8rem;
      letter-spacing: 0.3em;
      color: #000;
      text-decoration: none;
      transition: color 0.35s ease;
    }

    header nav a {
      text-decoration: none;
      margin-left: 22px;
      font-size: 0.9rem;
      transition: color 0.35s ease;
      color: #000;
    }

    header.scrolled .logo {
      color: #000;
    }
    header.scrolled nav a {
      color: #000;
    }

    /* HERO */
    .hero {
      position: relative;
    }
    .hero img {
      width: 100%;
      height: 620px;
      object-fit: cover;
      display: block;
    }
    .hero-text {
      position: absolute;
      top: 80%;
      left: 60px;
      transform: translateY(-50%);
    }
    .hero-text h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.8rem;
      margin-bottom: 2px;
      line-height: 1.1;
      color: #000; /* título negro sobre la imagen */
      text-shadow: 0 2px 12px rgba(255,255,255,0.45);
    }
    .hero-text p {
      font-size: 1.1rem;
      opacity: 0.95;
      line-height: 1.1;
