<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background-color: #000;
    }

    body {
      color: #fff;
      font-family: "Montserrat", sans-serif;
      line-height: 1.9;
    }

    /* HEADER — Ahora con fondo transparente y texto negro por defecto */
    header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      /* Fondo transparente inicialmente, para que se vea la imagen */
      background: rgba(0,0,0,0);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      z-index: 100;
      transition: background 0.35s ease, backdrop-filter 0.35s ease;
    }

    /* Cuando haces scroll, el fondo se vuelve oscuro (cristal) */
    header.scrolled {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* LOGO Y ENLACES: Color negro por defecto (sobre la imagen de hero) */
    .logo {
      font-family: "Parisienne", cursive;
      font-size: 1.8rem;
      letter-spacing: 0.3em;
      color: #000; /* Texto negro por defecto (sobre hero) */
      text-decoration: none;
      transition: color 0.35s ease;
    }

    header nav a {
      text-decoration: none;
      margin-left: 22px;
      font-size: 0.9rem;
      transition: color 0.35s ease;
      color: #000; /* Texto negro por defecto (sobre hero) */
    }

    /* Cuando haces scroll y el fondo del header se vuelve oscuro/cristal, el texto vuelve a ser blanco para que se vea */
    header.scrolled .logo {
      color: #fff; /* Vuelve a blanco cuando el header tiene fondo oscuro */
    }
    header.scrolled nav a {
      color: #fff; /* Vuelve a blanco cuando el header tiene fondo oscuro */
    }


    /* HERO: Mantenemos el texto sobre la imagen en negro (como pediste) */
    .hero-text h1 {
      /* ... */
      color: #000;
      text-shadow: none;
    }
    .hero-text p {
      /* ... */
      color: #000;
      text-shadow: none;
    }

    /* CARRUSEL: El banner gris que pediste eliminar sigue fuera */
    .carousel-main {
      position: relative;
      background: transparent; /* QUITADO EL BANNER GRIS */
      border-radius: 20px;
      padding: 26px 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* ... el resto de los estilos se mantienen */
</style>
