<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding | Charlie</title>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      color: #fff;
      font-family: "Montserrat", sans-serif;
      line-height: 1.9;
    }

    /* HEADER — transparente arriba y cristal al hacer scroll */
    header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      z-index: 100;
      transition: background 0.35s ease, backdrop-filter 0.35s ease;
    }
    header.scrolled {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* Letras del header en negro */
    .logo {
      font-family: "Parisienne", cursive;
      font-size: 1.8rem;
      letter-spacing: 0.3em;
      color: #000;
      text-decoration: none;
      transition: color 0.35s ease;
    }

    header nav a {
      text-decoration: none;
      margin-left: 22px;
      font-size: 0.9rem;
      transition: color 0.35s ease;
      color: #000;
    }
    header.scrolled nav a {
      color: #000;
    }

    /* HERO */
    .hero {
      position: relative;
    }
    .hero img {
      width: 100%;
      height: 620px;
      object-fit: cover;
      display: block;
    }
    .hero-text {
      position: absolute;
      top: 68%;
      left: 60px;
      transform: translateY(-50%);
    }
    .hero-text h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.8rem;
      margin-bottom: 2px;
      line-height: 1.1;
    }
    .hero-text p {
      font-size: 1.1rem;
      opacity: 0.9;
      line-height: 1.1;
      margin-top: 0;
    }

    /* CONTENIDO estilo Home */
    .content {
      max-width: 1300px;
      margin: 160px auto 90px;
      padding: 0 6vw;
      text-align: center;
    }
    .content p {
      max-width: 1200px;
      margin: 0 auto 26px;
      font-size: 1.32rem;
      line-height: 1.65;
    }
    .section-subtitle {
      font-family: "Playfair Display", serif;
      font-size: 2.25rem;
      font-weight: 500;
      margin-bottom: 26px;
      margin-top: 90px;
      letter-spacing: -0.01em;
      text-align: center;
    }

    /* CARRUSEL */
    .gallery-carousel {
      max-width: 1400px;
      margin: 0 auto 130px;
      padding: 0 30px;
    }
    .carousel-main {
      position: relative;
      background: radial-gradient(circle at top left, #222 0, #050505 45%, #000 100%);
      border-radius: 20px;
      padding: 26px 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .carousel-main img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.7);
      transition: transform 0.4s ease;
    }
    .carousel-main img.active {
      transform: scale(1.015);
    }
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 999px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 2.2rem;
      color: #fff;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.25s ease, transform 0.25s ease;
    }
    .carousel-arrow.left { left: 18px; }
    .carousel-arrow.right { right: 18px; }
    .carousel-arrow:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-50%) scale(1.04);
    }
    .carousel-thumbs {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .carousel-thumb {
      flex: 0 0 auto;
      width: 150px;
      aspect-ratio: 3/2;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      opacity: 0.55;
      border: 1px solid rgba(255,255,255,0.12);
      transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        border-color 0.25s ease;
    }
    .carousel-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .carousel-thumb.active {
      opacity: 1;
      border-color: rgba(255,255,255,0.9);
      transform: translateY(-3px);
    }
    .carousel-thumbs::-webkit-scrollbar {
      height: 6px;
    }
    .carousel-thumbs::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
    }

    /* Línea antes del contacto — oculta para quitar la franja gris */
    .footer-line {
      display: none;
    }

    /* CONTACTO */
    .contact-strip {
      max-width: 1100px;
      margin: 0 auto 160px;
      padding: 0 40px;
      text-align: center;
    }
    .contact-label {
      font-family: "Playfair Display", serif;
      font-size: 1.4rem;
      margin-top: 28px;
      margin-bottom: 4px;
      text-transform: lowercase;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.03em;
    }
    .contact-strip-info p {
      margin: 8px 0;
      font-size: 1rem;
    }
    .contact-strip-info a {
      color: #fff;
      text-decoration: none;
    }
    .contact-strip-info a:hover {
      opacity: 0.8;
    }

    @media (max-width: 700px) {
      .hero img { height: 280px; }
      .hero-text { top: 52%; left: 24px; }
      .gallery-carousel { padding: 0 22px; margin-bottom: 90px; }
      .carousel-main { padding: 18px 18px; border-radius: 16px; }
      .carousel-main img { max-height: 68vh; }
      .carousel-thumb { width: 110px; border-radius: 8px; }
      .contact-strip { padding: 0 20px; margin: 120px auto 140px; }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">Charlie...</a>
  <nav>
    <a href="index.html">Home</a>
  </nav>
</header>

<section class="hero">
  <img src="wencabezado.jpg" alt="Wedding">
  <div
