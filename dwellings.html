<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dwellings | Charlie</title>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      color: #fff;
      font-family: "Montserrat", sans-serif;
      line-height: 1.9;
    }

    /* HEADER — transparente arriba y cristal al hacer scroll */
    header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      z-index: 100;
      transition: background 0.35s ease, backdrop-filter 0.35s ease;
    }
    header.scrolled {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .logo {
      font-family: "Parisienne", cursive;
      font-size: 1.8rem;
      letter-spacing: 0.3em;
      color: #fff;
      text-decoration: none;
      transition: color 0.35s ease;
    }

    header nav a {
      text-decoration: none;
      margin-left: 22px;
      font-size: 0.9rem;
      transition: color 0.35s ease;
      color: #000;
    }
    header.scrolled nav a {
      color: #fff;
    }

    /* HERO */
    .hero {
      position: relative;
    }
    .hero img {
      width: 100%;
      height: 480px;
      object-fit: cover;
      display: block;
    }
    .hero-text {
      position: absolute;
      top: 70%;
      left: 60px;
      transform: translateY(-50%);
    }
    .hero-text h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.8rem;
      margin-bottom: 2px;
      line-height: 1.1;
    }
    .hero-text p {
      font-size: 1.1rem;
      opacity: 0.9;
      line-height: 1.1;
      margin-top: 0;
    }

    /* CONTENIDO — estilo similar al Home */
    .content {
      max-width: 1300px;
      margin: 120px auto 90px;
      padding: 0 6vw;
      text-align: center;
    }
    .content p {
      max-width: 1200px;
      margin: 0 auto 26px;
      font-size: 1.32rem;
      line-height: 1.65;
    }
    .section-subtitle {
      font-family: "Playfair Display", serif;
      font-size: 2.25rem;
      font-weight: 500;
      margin-bottom: 26px;
      margin-top: 90px;
      letter-spacing: -0.01em;
      text-align: center;
    }
